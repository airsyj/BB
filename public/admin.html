<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>后台管理 - 报备系统</title>
<link rel="stylesheet" href="/style.css" />
<style>
  .dl-btns { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 18px; }
  .dl-btns a, .dl-btns button {
    flex: 1 0 auto; padding: 12px 10px; text-align: center; text-decoration: none;
    background: var(--primary); color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 7px 8px; text-align: left; }
  th { background: #f7fafc; position: sticky; top: 0; }
  .token-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .token-bar input { flex: 1; }
  .date-bar { display: flex; gap: 10px; align-items: center; }
  .date-bar input[type=date] { flex: 0 0 auto; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; }
  .badge.new { background: #ebf8ff; color: #2b6cb0; }
  .badge.ren { background: #fffaf0; color: #c05621; }
</style>
</head>
<body>
<header class="app">后台管理 · 报备报表</header>
<main>
  <div class="card">
    <div class="token-bar">
      <input id="token" placeholder="管理 token" />
      <button class="btn secondary" style="width:auto;padding:11px 16px" onclick="loadList()">连接</button>
    </div>
    <div class="dl-btns">
      <a href="#" data-type="personnel">下载人员信息</a>
      <a href="#" data-type="vehicle">下载司机信息</a>
      <a href="#" data-type="material_in">下载物资进场</a>
      <a href="#" data-type="material_out">下载物资出场</a>
      <a href="#" data-type="all">下载全部</a>
    </div>
    <div id="stat" class="hint"></div>
  </div>
  <div class="card">
    <h3>发布通知 <span class="tag">将展示在报备首页顶部</span></h3>
    <textarea id="noticeText" rows="3" placeholder="输入要发布的通告内容…" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical"></textarea>
    <div class="dl-btns" style="margin-top:10px">
      <button type="button" onclick="publishNotice()">发布通知</button>
    </div>
    <div id="noticeStat" class="hint"></div>
    <div id="noticeList" style="margin-top:8px"></div>
  </div>
  <div class="card date-bar">
    <label for="date">单日：</label>
    <input type="date" id="date" />
    <span style="color:var(--muted)">或</span>
    <label for="dateFrom">区间：</label>
    <input type="date" id="dateFrom" />
    <span style="color:var(--muted)">至</span>
    <input type="date" id="dateTo" />
    <button class="btn secondary" style="width:auto;padding:11px 16px" onclick="loadList()">查询</button>
    <button class="btn secondary" style="width:auto;padding:11px 16px" onclick="clearDates()">全部</button>
    <span id="dateStat" class="hint"></span>
    <div style="flex-basis:100%;color:var(--muted);font-size:12px;margin-top:4px">
      不填任何日期 = 查看 / 导出<b>全部</b>；填“单日”或“区间”二选一（填一个会自动清空另一个）。下载表格同理。
    </div>
  </div>
  <div class="card">
    <h3>批量导入人员/车辆汇总 <span class="tag">上传系统导出的 xlsx，自动写入并可被报备自动填充</span></h3>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="file" id="importFile" accept=".xlsx,.xls" />
      <button type="button" class="btn secondary" style="width:auto;padding:11px 16px" onclick="doImport()">导入</button>
    </div>
    <div id="importStat" class="hint"></div>
  </div>
  <div class="card" style="padding:0;overflow:auto;max-height:70vh;">
    <table id="tbl">
      <thead><tr><th>编号</th><th>类型</th><th>姓名/车牌</th><th>身份证号</th><th>手机</th><th>提交日期</th><th>通行有效期</th><th>状态</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="admin-link"><a href="/">← 返回报备首页</a></div>
</main>
<script src="/admin.js"></script>
</body>
</html>
